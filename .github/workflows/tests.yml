# Deliberately NOT named "CI".
#
# The `agent-iterate-ci.yml` and `agent-review-panel.yml` copies in this repo
# trigger on `workflow_run: workflows: ["CI"]`. Naming this workflow "CI" would
# wake them on every push here. They would no-op — every entry job gates on
# `vars.AGENT_PIPELINE_ENABLED == 'true'`, which is unset in this repo — but the
# runs would be noise, and relying on a kill switch for something a name choice
# can prevent outright is the wrong default.
name: Pipeline Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      # NO `npm ci`. The suite must pass with `node_modules` ABSENT, because
      # that is the condition wafflebase's `agent:tests` lane runs under and it
      # is what makes the module-scope import guard in ask.test.mjs meaningful.
      # A module that statically imported the Agent SDK would take the whole
      # suite down here — which is the point.
      - name: Unit tests (node_modules absent, by design)
        working-directory: packages/pipeline
        run: node --test-timeout=60000 --test '**/*.test.mjs'

  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Acceptance criterion for the extraction's step 1a: nothing in the moved
      # set may reach a file that stayed behind in wafflebase.
      - name: No import escapes packages/pipeline
        working-directory: packages/pipeline
        run: |
          set -euo pipefail
          if grep -nE 'from "(\.\./|/)' ./*.mjs; then
            echo "::error::an import reaches outside packages/pipeline"; exit 1
          fi
          echo "ok: no import escapes packages/pipeline"

      - name: Every relative import resolves
        working-directory: packages/pipeline
        run: |
          set -euo pipefail
          missing=0
          for t in $(grep -hoE 'from "\./[^"]+"|import\("\./[^"]+"\)' ./*.mjs \
                     | grep -oE '\./[A-Za-z0-9._/-]+' | sort -u); do
            if [ ! -f "${t#./}" ]; then echo "::error::unresolved import $t"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "ok: import closure holds"

      # The invariant ask.test.mjs:449-486 enforces, restated as a cheap lane so
      # a violation is named directly instead of surfacing as a suite-wide crash.
      - name: Third-party imports are dynamic-only
        working-directory: packages/pipeline
        run: |
          set -euo pipefail
          if grep -nE '^\s*(import|export)[^(]*from\s+"[^./n]' ./*.mjs; then
            echo "::error::module-scope bare specifier — third-party deps must be await import()ed inside a function"
            exit 1
          fi
          echo "ok: no module-scope bare specifiers"

      # Step 2 adds one grep-zero lane per constant family as it is centralised
      # into config.mjs (see EXTRACTION_PLAN.md §2.2). Nothing to assert yet —
      # the move in step 1a is verbatim on purpose.
