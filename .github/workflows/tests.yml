# Deliberately NOT named "CI".
#
# The `agent-iterate-ci.yml` and `agent-review-panel.yml` copies in this repo
# trigger on `workflow_run: workflows: ["CI"]`. Naming this workflow "CI" would
# wake them on every push here. They would no-op — every entry job gates on
# `vars.AGENT_PIPELINE_ENABLED == 'true'`, which is unset in this repo — but the
# runs would be noise, and relying on a kill switch for something a name choice
# can prevent outright is the wrong default.
#
# The name is ALSO load-bearing for the extraction. `mark-ready.mjs` and
# `set-state.mjs` still hardcode `r.name === "CI"` when they look for the CI run,
# so this repo is the only place a non-default CI name gets exercised at all —
# wafflebase and the yorkie pilot are both called "CI", which means a residual
# hardcode passes unnoticed in both. Renaming this to "CI" would quietly retire
# the one test of that path. See EXTRACTION_PLAN.md finding #50.
#
# EACH JOB RUNS ONE NAMED LANE from scripts/verify-self.mjs, the same runner
# `pnpm verify:fast` uses locally. These commands used to be inline shell here,
# which meant a contributor could not run them before pushing and nothing kept
# the shell honest.
name: Pipeline Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      # NO INSTALL IN THIS JOB, ON PURPOSE — do not add one.
      #
      # The suite must pass with `node_modules` absent, because that is the
      # condition wafflebase's `agent:tests` lane runs under and it is what
      # ENFORCES the dynamic-import rule: third-party deps (the Agent SDK, zod)
      # are reachable only through `await import()` inside the function that needs
      # them. A module that imported the SDK at load time would take the whole
      # suite down here, which is the intended signal.
      #
      # `verify-invariants.mjs` checks the same property statically, in the job
      # below. The two are belt and braces, and the braces only exist while this
      # directory is empty — which is why the lint lane, the one thing here that
      # does need devDependencies, is a separate job.
      - name: Unit tests (node_modules absent, by design)
        run: node scripts/verify-self.mjs --lane tests

  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      # Also no install: this lane reads source, it does not run it.
      - name: Structural invariants
        run: node scripts/verify-self.mjs --lane invariants

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      # The ONLY job that installs, and it installs at the ROOT — never inside
      # packages/pipeline, whose emptiness the tests job depends on.
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: node scripts/verify-self.mjs --lane lint
